# bloop:managed audit-workflow
# The dependency audit lives here, not in checks.sh, because it needs the network
# and its result changes on its own even when the code does not, which would make
# checks.sh untrustworthy.
name: audit

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx pnpm audit --audit-level high
